<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadSearch — Lead Verification Pipeline</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/logo.png" class="logo-img" alt="Beyond Border" />
      <div>
        <h1>LeadSearch</h1>
        <p class="tagline">Lead → verified profile → fit verdict</p>
      </div>
    </div>
    <div id="providers" class="providers"></div>
  </header>

  <main>
    <!-- Controls -->
    <section class="panel controls">
      <label class="filedrop" id="filedrop">
        <input type="file" id="fileInput" accept=".csv" hidden />
        <span class="filedrop-icon">⬆</span>
        <span class="filedrop-text">Drop a leads CSV or <b>browse</b></span>
        <span class="filedrop-hint">or pull straight from Google Sheets →</span>
      </label>
      <div class="actions">
        <button id="runBtn" class="btn primary">Run pipeline ▸</button>
        <button id="pullBtn" class="btn ghost" hidden>⬇ Pull from Sheet</button>
        <button id="pushBtn" class="btn ghost" hidden>⬆ Push to Sheet</button>
        <a href="/api/export" class="btn ghost">Export CSV</a>
        <button id="resetBtn" class="btn danger-ghost">Reset</button>
      </div>
      <div id="uploadMsg" class="msg"></div>
    </section>

    <!-- Animated pipeline -->
    <section class="panel pipeline" id="pipeline">
      <div class="pipeline-head">
        <span class="pipeline-title">The pipeline</span>
        <span class="pipeline-now" id="pipelineNow">Idle</span>
      </div>
      <svg id="snake" viewBox="0 0 920 340" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path id="track" class="track"
              d="M130,100 H790 Q860,100 860,170 Q860,240 790,240 H130" pathLength="100"/>
        <path id="trackDone" class="track-done"
              d="M130,100 H790 Q860,100 860,170 Q860,240 790,240 H130"
              pathLength="100" stroke-dasharray="0 100"/>
        <!-- flowing dots -->
        <g class="flow">
          <circle r="4" class="flow-dot"><animateMotion dur="7s" repeatCount="indefinite" begin="0s"><mpath href="#track"/></animateMotion></circle>
          <circle r="4" class="flow-dot"><animateMotion dur="7s" repeatCount="indefinite" begin="-1.75s"><mpath href="#track"/></animateMotion></circle>
          <circle r="4" class="flow-dot"><animateMotion dur="7s" repeatCount="indefinite" begin="-3.5s"><mpath href="#track"/></animateMotion></circle>
          <circle r="4" class="flow-dot"><animateMotion dur="7s" repeatCount="indefinite" begin="-5.25s"><mpath href="#track"/></animateMotion></circle>
        </g>
        <!-- nodes: [x, y, label] ; path order 1-4 top L→R, 5-8 bottom R→L -->
        <g class="node" data-i="1"><circle cx="130" cy="100" r="13"/><text x="130" y="66">Ingest</text></g>
        <g class="node" data-i="2"><circle cx="350" cy="100" r="13"/><text x="350" y="66">Extract</text></g>
        <g class="node" data-i="3"><circle cx="570" cy="100" r="13"/><text x="570" y="66">Queries</text></g>
        <g class="node" data-i="4"><circle cx="790" cy="100" r="13"/><text x="790" y="66">Search</text></g>
        <g class="node" data-i="5"><circle cx="790" cy="240" r="13"/><text x="790" y="278">Match</text></g>
        <g class="node" data-i="6"><circle cx="570" cy="240" r="13"/><text x="570" y="278">Scrape</text></g>
        <g class="node" data-i="7"><circle cx="350" cy="240" r="13"/><text x="350" y="278">Screen</text></g>
        <g class="node" data-i="8"><circle cx="130" cy="240" r="13"/><text x="130" y="278">Output</text></g>
      </svg>
    </section>

    <!-- Stats -->
    <section class="stats" id="stats"></section>

    <!-- Tabs -->
    <nav class="tabs" id="tabs">
      <button data-view="all" class="tab active">All leads</button>
      <button data-view="review" class="tab">Needs review <span id="reviewCount" class="tab-count">0</span></button>
    </nav>

    <!-- All leads table -->
    <section class="panel view" id="viewAll">
      <table class="leads">
        <thead>
          <tr><th>#</th><th>Name</th><th>Company</th><th>Status</th><th>Top match</th><th>Fit</th><th></th></tr>
        </thead>
        <tbody id="leadRows">
          <tr><td colspan="7" class="empty">No leads yet — upload a CSV or pull from your sheet.</td></tr>
        </tbody>
      </table>
    </section>

    <!-- Review cards -->
    <section class="view" id="viewReview" hidden>
      <div id="reviewCards" class="review-grid"></div>
    </section>
  </main>

  <!-- Detail drawer -->
  <div id="drawer" class="drawer">
    <div class="drawer-panel">
      <button class="drawer-close" id="drawerClose">✕</button>
      <div id="drawerBody"></div>
    </div>
  </div>

  <footer class="footer">Beyond Border · LeadSearch</footer>
  <script src="/static/app.js"></script>
</body>
</html>
