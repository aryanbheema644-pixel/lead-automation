<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadSearch</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="side-brand">
        <img src="/static/logo.png" class="logo-img" alt="Beyond Border" />
        <div><div class="brand-name">LeadSearch</div><div class="brand-sub">Beyond Border</div></div>
      </div>
      <nav class="side-nav" id="nav">
        <a href="#dashboard" data-page="dashboard" class="nav-item"><span class="ico">◧</span> Dashboard</a>
        <a href="#pipeline" data-page="pipeline" class="nav-item"><span class="ico">⇉</span> Pipeline</a>
        <a href="#leads" data-page="leads" class="nav-item"><span class="ico">☰</span> Leads</a>
        <a href="#review" data-page="review" class="nav-item"><span class="ico">✓</span> Review <span id="reviewCount" class="nav-badge">0</span></a>
      </nav>
      <div class="side-foot" id="providers"></div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <h2 id="pageTitle">Dashboard</h2>
        <div class="actions">
          <button id="runBtn" class="btn primary">Run pipeline ▸</button>
          <button id="pullBtn" class="btn ghost" hidden>⬇ Pull</button>
          <button id="pushBtn" class="btn ghost" hidden>⬆ Push</button>
          <button id="baselineBtn" class="btn ghost" hidden title="Mark current source rows as seen">⦰ Baseline</button>
          <a href="/api/export" class="btn ghost">Export</a>
          <button id="resetBtn" class="btn danger-ghost">Reset</button>
        </div>
      </header>
      <div id="uploadMsg" class="msg"></div>

      <div class="content">
        <!-- Dashboard -->
        <section class="page" data-page="dashboard">
          <div class="stat-row" id="stats"></div>
          <div class="analytics">
            <div class="panel chart-card"><h3>Leads by channel</h3><div class="chart-wrap"><canvas id="chChannels"></canvas></div></div>
            <div class="panel chart-card"><h3>Outcomes</h3><div class="chart-wrap"><canvas id="chOutcomes"></canvas></div></div>
            <div class="panel chart-card"><h3>Fit verdicts</h3><div class="chart-wrap"><canvas id="chTiers"></canvas></div></div>
            <div class="panel chart-card"><h3>AE workload</h3><div class="chart-wrap"><canvas id="chOwners"></canvas></div></div>
            <div class="panel chart-card wide"><h3>Leads over time</h3><div class="chart-wrap"><canvas id="chTime"></canvas></div></div>
          </div>
        </section>

        <!-- Pipeline -->
        <section class="page" data-page="pipeline" hidden>
          <label class="filedrop panel" id="filedrop">
            <input type="file" id="fileInput" accept=".csv" hidden />
            <span class="filedrop-icon">⬆</span>
            <span class="filedrop-text">Drop a leads CSV or <b>browse</b></span>
            <span class="filedrop-hint">or use ⬇ Pull to read from Google Sheets</span>
          </label>
          <div class="panel pipeline" id="pipeline">
            <div class="pipeline-head">
              <span class="pipeline-title">Live pipeline</span>
              <span class="pipeline-now" id="pipelineNow">Idle</span>
            </div>
            <svg id="snake" viewBox="0 0 920 340" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <defs><linearGradient id="doneGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="var(--primary-2)"/>
              </linearGradient></defs>
              <path id="track" class="track" d="M130,100 H790 Q860,100 860,170 Q860,240 790,240 H130" pathLength="100"/>
              <path id="trackDone" class="track-done" d="M130,100 H790 Q860,100 860,170 Q860,240 790,240 H130" pathLength="100" stroke-dasharray="0 100"/>
              <g class="flow">
                <circle r="4.5" class="flow-dot"><animateMotion dur="7s" repeatCount="indefinite" begin="0s"><mpath href="#track"/></animateMotion></circle>
                <circle r="4.5" class="flow-dot"><animateMotion dur="7s" repeatCount="indefinite" begin="-1.75s"><mpath href="#track"/></animateMotion></circle>
                <circle r="4.5" class="flow-dot"><animateMotion dur="7s" repeatCount="indefinite" begin="-3.5s"><mpath href="#track"/></animateMotion></circle>
                <circle r="4.5" class="flow-dot"><animateMotion dur="7s" repeatCount="indefinite" begin="-5.25s"><mpath href="#track"/></animateMotion></circle>
              </g>
              <g class="node" data-i="1"><circle cx="130" cy="100" r="13"/><text x="130" y="66">Ingest</text></g>
              <g class="node" data-i="2"><circle cx="350" cy="100" r="13"/><text x="350" y="66">Extract</text></g>
              <g class="node" data-i="3"><circle cx="570" cy="100" r="13"/><text x="570" y="66">Queries</text></g>
              <g class="node" data-i="4"><circle cx="790" cy="100" r="13"/><text x="790" y="66">Search</text></g>
              <g class="node" data-i="5"><circle cx="790" cy="240" r="13"/><text x="790" y="278">Match</text></g>
              <g class="node" data-i="6"><circle cx="570" cy="240" r="13"/><text x="570" y="278">Scrape</text></g>
              <g class="node" data-i="7"><circle cx="350" cy="240" r="13"/><text x="350" y="278">Screen</text></g>
              <g class="node" data-i="8"><circle cx="130" cy="240" r="13"/><text x="130" y="278">Output</text></g>
            </svg>
          </div>
        </section>

        <!-- Leads -->
        <section class="page" data-page="leads" hidden>
          <div class="panel view">
            <table class="leads">
              <thead><tr><th>#</th><th>Name</th><th>Channel</th><th>Status</th><th>Top match</th><th>Fit</th><th>AE</th><th></th></tr></thead>
              <tbody id="leadRows"><tr><td colspan="8" class="empty">No leads yet — upload a CSV or pull from your sheet.</td></tr></tbody>
            </table>
          </div>
        </section>

        <!-- Review -->
        <section class="page" data-page="review" hidden>
          <div id="reviewCards" class="review-grid"></div>
        </section>
      </div>
    </div>
  </div>

  <div id="drawer" class="drawer">
    <div class="drawer-panel">
      <button class="drawer-close" id="drawerClose">✕</button>
      <div id="drawerBody"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
